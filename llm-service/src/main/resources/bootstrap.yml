spring:
  application:
    name: llm-service
  main:
    allow-bean-definition-overriding: true
  config:
    import: "optional:configserver:"
  cloud:
    config:
      uri: http://config-server:8888
      fail-fast: true
      retry:
        initial-interval: 2000
        max-attempts: 10
        max-interval: 10000
        multiplier: 1.5