security:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:8080
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - X-XSRF-TOKEN
    allow-credentials: true
  rate-limit:
    capacity: 10
    refill-tokens: 10
    refill-duration: 1m
  jwt:
    secret: ${JWT_SECRET:bllRbxCOXTiYhFGAapfUb4ob3bglSuz7QJ8xUpmTV9M=}
    expiration: 36000000
    algorithm: HS256

spring:
  application:
    name: security-service
  cloud:
    config:
      import: "optional:configserver:"

server:
  port: 8081

management:
  tracing:
    enabled: false
    sampling:
      probability: 0.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  packages-to-scan: gon.cue.security
  paths-to-match: /api/**
  show-actuator: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

---
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    config:
      uri: http://config-server:8888

eureka:
  client:
    service-url:
      defaultZone: http://eureka:password@eureka-server:8761/eureka/